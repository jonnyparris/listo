name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# One production deploy at a time, and never cancelled mid-flight: an
# interrupted upload can leave the project without a fresh production release.
concurrency:
  group: pages-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Verification gate: nothing reaches production unless the type-check and
  # build pass. Requiring this check on main later makes a red PR unmergeable.
  verify:
    name: Type-check and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Build
        run: npm run build

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    # Attach the production credential to an environment so it can be scoped
    # and require reviewers, instead of being readable by every workflow.
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '4b430e167a301330d13a9bb42f3986a2' }}
        # --no-install keeps the deploy on the lockfile-pinned wrangler instead
        # of fetching one from the registry at deploy time.
        run: npx --no-install wrangler pages deploy .svelte-kit/cloudflare --project-name=listo --branch=main --commit-hash "$GITHUB_SHA"
